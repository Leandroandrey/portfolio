<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Monograma no roxo da paleta com as letras em preto. É a mesma regra do
    resto do site: #A050FF dá 4.71:1 com o preto e só 1.9:1 com o osso, então
    texto em cima do roxo é sempre preto.

    O roxo cheio também é o que faz a aba ser achável: contrasta tanto com a
    barra clara quanto com a escura, sem precisar de duas versões.
  -->
  <rect width="32" height="32" rx="8" fill="#A050FF"/>
  <text x="16" y="16" fill="#0d0d0d"
        font-family="Archivo, 'Arial Black', Helvetica, sans-serif"
        font-weight="900" font-size="17" letter-spacing="-1"
        text-anchor="middle" dominant-baseline="central">LG</text>
</svg>
